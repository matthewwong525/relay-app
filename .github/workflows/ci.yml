# Every push: analyze and test, then the Android build on every branch and the iPhone build where the keys allow.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ios.yml
    secrets: inherit

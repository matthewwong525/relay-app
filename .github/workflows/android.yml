# The Android app: a signed release file on main, and a file to try on any other branch.
name: Android
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.RELAY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELAY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No upload key in this repository's secrets, so this file is signed with a debug key and will not install over a release."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk relay-${{ github.run_number }}.apk
      - name: File to try
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: relay-android-${{ github.run_number }}
          path: relay-${{ github.run_number }}.apk
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "relay-${{ github.run_number }}.apk" \
            --title "Relay for Android, build ${{ github.run_number }}" \
            --notes "Install this file on your Android phone. Built from ${{ github.sha }}." --latest
